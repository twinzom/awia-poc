[project]
name = "awia-mvp"
version = "0.1.0"
description = "Wealth agent MVP proof of concept: signal detectors"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.scripts]
awia-a1 = "awia.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
